<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Корпус консоли -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="#333333" stroke="#555555" stroke-width="8" />
  <!-- Верхний экран (256x192) -->
  <rect x="128" y="96" width="256" height="152" rx="10" fill="#000000" stroke="#1a1a1a" stroke-width="4" />
  <!-- Нижний сенсорный экран -->
  <rect x="156" y="264" width="200" height="152" rx="10" fill="#000000" stroke="#1a1a1a" stroke-width="4" />
  <!-- Крестовина (D-Pad) -->
  <path d="M 80 320 h 20 v -20 h 20 v 20 h 20 v 20 h -20 v 20 h -20 v -20 h -20 z" fill="#cccccc" />
  <!-- Кнопки действий (X, Y, A, B) -->
  <circle cx="410" cy="310" r="10" fill="#cccccc" />
  <circle cx="434" cy="330" r="10" fill="#cccccc" />
  <circle cx="386" cy="330" r="10" fill="#cccccc" />
  <circle cx="410" cy="350" r="10" fill="#cccccc" />
  <!-- Системные кнопки (Select, Start) -->
  <rect x="220" y="440" width="30" height="10" rx="5" fill="#888888" />
  <rect x="262" y="440" width="30" height="10" rx="5" fill="#888888" />
</svg>